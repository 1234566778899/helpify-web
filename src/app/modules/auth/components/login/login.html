<div class="login-container">
    <div class="login-card-wrapper">
        <mat-card class="login-card">
            <mat-card-header>
                <div class="header-content">
                    <img src="assets/images/logo.png" alt="Helpify Logo" class="logo">
                    <h1>INICIAR SESIÓN</h1>
                    <p class="subtitle">Bienvenido de vuelta a Helpify</p>
                </div>
            </mat-card-header>

            <mat-card-content>
                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
                    <!-- Usuario -->
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Nombre de usuario</mat-label>
                        <input matInput formControlName="nombre" placeholder="Ingresa tu usuario"
                            autocomplete="username">
                        <mat-icon matPrefix>person</mat-icon>
                        <mat-error *ngIf="loginForm.get('nombre')?.invalid">
                            {{ getErrorMessage('nombre') }}
                        </mat-error>
                    </mat-form-field>

                    <!-- Contraseña -->
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Contraseña</mat-label>
                        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password"
                            placeholder="Ingresa tu contraseña" autocomplete="current-password">
                        <mat-icon matPrefix>lock</mat-icon>
                        <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword"
                            [attr.aria-label]="'Ocultar contraseña'" [attr.aria-pressed]="hidePassword">
                            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                        </button>
                        <mat-error *ngIf="loginForm.get('password')?.invalid">
                            {{ getErrorMessage('password') }}
                        </mat-error>
                    </mat-form-field>

                    <!-- Botón Submit -->
                    <button mat-raised-button color="primary" type="submit" class="submit-button"
                        [disabled]="isLoading">
                        <span *ngIf="!isLoading">INGRESAR</span>
                        <span *ngIf="isLoading">INGRESANDO...</span>
                    </button>

                    <!-- Link a Registro -->
                    <div class="register-link">
                        <p>¿No tienes una cuenta?
                            <a routerLink="/register">Regístrate aquí</a>
                        </p>
                    </div>
                </form>
            </mat-card-content>
        </mat-card>
    </div>
</div>
