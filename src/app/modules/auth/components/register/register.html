<main class="main">
    <!-- Botón de retroceso -->
    <section class="back-btn">
        <button mat-icon-button (click)="goBack()" aria-label="volver">
            <span class="arrow-left">←</span>
        </button>
    </section>

    <section class="hero">
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-card" novalidate>
            <h1 class="title">CREA UNA CUENTA</h1>

            <div class="form-grid">
                <!-- Tipo de documento -->
                <label for="nombredocumento">Tipo de documento:</label>
                <div class="select-wrapper">
                    <select id="nombredocumento" formControlName="nombredocumento" class="select-rosado">
                        <option value="">Selecciona...</option>
                        <option *ngFor="let tipo of tiposDocumento" [value]="tipo.value">{{ tipo.label }}</option>
                    </select>
                </div>

                <label for="numerodocumento">Número de documento:</label>
                <input id="numerodocumento" type="text" formControlName="numerodocumento" maxlength="12" />

                <label for="nombre">Nombre:</label>
                <input id="nombre" type="text" formControlName="nombre" />

                <label for="apellidopaterno">Apellido paterno:</label>
                <input id="apellidopaterno" type="text" formControlName="apellidopaterno" />

                <label for="apellidomaterno">Apellido materno:</label>
                <input id="apellidomaterno" type="text" formControlName="apellidomaterno" />

                <label for="celular">Número de celular:</label>
                <input id="celular" type="tel" formControlName="celular" placeholder="9XXXXXXXX" maxlength="9" />

                <label for="correo">Correo electrónico:</label>
                <input id="correo" type="email" formControlName="correo" placeholder="ejemplo@correo.com" />

                <label for="password">Contraseña:</label>
                <div class="password-row">
                    <input id="password" [type]="hidePassword ? 'password' : 'text'" formControlName="password"
                        placeholder="Mínimo 8 caracteres" />
                    <button type="button" id="togglePassword" (click)="hidePassword = !hidePassword">
                        {{ hidePassword ? '👁️' : '🙈' }}
                    </button>
                </div>

                <label for="idRol">Rol:</label>
                <div class="select-wrapper">
                    <select id="idRol" formControlName="idRol" class="select-rosado">
                        <option value="">Selecciona...</option>
                        <option *ngFor="let rol of roles" [value]="rol.value">{{ rol.label }}</option>
                    </select>
                </div>

                <!-- Aceptar términos -->
                <div class="terms-wrap">
                    <label class="checkbox-label">
                        <input type="checkbox" formControlName="aceptaTerminos" /> Acepto los
                        <a routerLink="/terminos-condiciones" target="_blank">términos y condiciones</a>
                    </label>
                </div>

                <!-- Botón enviar -->
                <div class="submit-wrap">
                    <button class="btn-submit" type="submit" [disabled]="isLoading">
                        {{ isLoading ? 'REGISTRANDO...' : 'ENVIAR' }}
                    </button>
                </div>
            </div>

            <div class="form-messages">
                <div *ngIf="registerForm.invalid && registerForm.touched">Revisa los campos antes de continuar.</div>
            </div>

            <div class="login-link">
                <p>¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión aquí</a></p>
            </div>
        </form>
    </section>
</main>
