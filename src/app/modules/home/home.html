<!-- VISTA DE USUARIO AUTENTICADO -->
<ng-container *ngIf="isAuthenticated">
    <section class="wishlist-wrapper">
        <!-- Sección Usuario -->
        <h1 class="titulo-seccion">USUARIO</h1>

        <div class="usuario-card">
            <div class="usuario-info">
                <span class="usuario-icon">👤</span>
                <span class="usuario-nombre">{{ userName }}</span>
            </div>
        </div>

        <!-- Sección Wishlist -->
        <h2 class="titulo-seccion">WISHLIST</h2>

        <div class="wishlist-lista" *ngIf="wishlistProyectos.length > 0; else emptyState">
            <div class="wishlist-item" *ngFor="let proyecto of wishlistProyectos">
                <div class="wishlist-icono">
                    <img *ngIf="proyecto.idproyecto === 1"
                        src="https://www.afoe.org/wp-content/uploads/2020/09/metodologias-tic-aula-afoe.jpg"
                        alt="Tecnología para Aprender" />
                    <img *ngIf="proyecto.idproyecto === 2"
                        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZ_Rgs-O3wu4GSdb4k4t1KTQdHxS3xNUEKkw&s"
                        alt="Escuelas con Futuro" />
                </div>

                <div class="wishlist-info">
                    <h3>{{ proyecto.nombreproyecto }}</h3>
                    <p>{{ proyecto.descripcion }}</p>
                </div>

                <div class="wishlist-accion">
                    <button class="btn-ver-mas" [routerLink]="['/proyectos', proyecto.idproyecto]">
                        Ver más
                    </button>
                </div>
            </div>
        </div>

        <ng-template #emptyState>
            <div class="empty-state">
                <p>No tienes proyectos en tu wishlist</p>
                <button routerLink="/proyectos" class="btn-ver-mas">Explorar proyectos</button>
            </div>
        </ng-template>
    </section>
</ng-container>
